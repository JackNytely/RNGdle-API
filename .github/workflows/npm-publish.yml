name: Build and Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install dependencies (using --frozen-lockfile since we are committing our lockfile)
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Publish if this version is not on npm yet
      - name: BUN Publish if this version is not on NPM yet
        env:
          # Token for using NPM to publish
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}

          # Token for using Bun to publish
          NPM_CONFIG_TOKEN: ${{ secrets.npm_token }}
        run: bun publish --tolerate-republish
